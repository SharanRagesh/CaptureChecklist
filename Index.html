<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3DGS Field Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js" referrerpolicy="no-referrer"></script>
<style>
  :root {
    --bg: #17181A;
    --panel: #1F2123;
    --panel-2: #26282B;
    --line: #33363A;
    --text: #EDEDE8;
    --text-dim: #9A9C9F;
    --text-faint: #6B6E72;
    --accent: #FF7A1A;
    --accent-dim: #B85A16;
    --accent-text: #FFB27A;
    --ok: #7FB08C;
    --ok-text: #A9CBB1;
    --danger: #D9634F;
    --radius: 10px;
  }
  :root[data-theme="light"] {
    --bg: #EDEEE9;
    --panel: #FFFFFF;
    --panel-2: #F5F5F1;
    --line: #D9DAD3;
    --text: #1B1C1E;
    --text-dim: #5B5D58;
    --text-faint: #8B8D87;
    --accent: #D9600F;
    --accent-dim: #B85A16;
    --accent-text: #B85A16;
    --ok: #3E7A50;
    --ok-text: #2E5E3D;
    --danger: #B23A28;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #EDEEE9;
      --panel: #FFFFFF;
      --panel-2: #F5F5F1;
      --line: #D9DAD3;
      --text: #1B1C1E;
      --text-dim: #5B5D58;
      --text-faint: #8B8D87;
      --accent: #D9600F;
      --accent-dim: #B85A16;
      --accent-text: #B85A16;
      --ok: #3E7A50;
      --ok-text: #2E5E3D;
      --danger: #B23A28;
    }
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
  }
  body {
    max-width: 720px;
    margin: 0 auto;
    padding: 20px 16px 64px;
  }

  .mono { font-family: 'IBM Plex Mono', monospace; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 18px;
  }
  .title-block h1 {
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 800;
    font-size: 34px;
    letter-spacing: 0.3px;
    line-height: 1;
    margin: 0;
    text-transform: uppercase;
  }
  .title-block p {
    margin: 6px 0 0;
    font-size: 13px;
    color: var(--text-dim);
  }
  .header-right {
    text-align: right;
    flex-shrink: 0;
  }
  .total-count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 22px;
    font-weight: 600;
    color: var(--accent-text);
    line-height: 1;
  }
  .total-label {
    font-size: 11px;
    color: var(--text-faint);
    margin-top: 4px;
  }
  .theme-btn {
    margin-top: 10px;
    background: none;
    border: 1px solid var(--line);
    color: var(--text-dim);
    border-radius: 6px;
    font-size: 11px;
    padding: 4px 8px;
    cursor: pointer;
    font-family: 'IBM Plex Mono', monospace;
  }
  .theme-btn:hover { border-color: var(--text-faint); }

  /* Rig dial tabs */
  .dial {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-bottom: 6px;
  }
  .dial button {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text-dim);
    border-radius: 8px;
    padding: 10px 4px 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.4px;
    cursor: pointer;
    text-transform: uppercase;
    text-align: center;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .dial button:hover { border-color: var(--text-faint); color: var(--text); }
  .dial button.active {
    border-color: var(--accent);
    color: var(--accent-text);
    background: var(--panel-2);
  }

  /* Progress meter */
  .meter-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 14px 0 22px;
  }
  .meter {
    flex: 1;
    height: 6px;
    background: var(--panel-2);
    border-radius: 3px;
    overflow: hidden;
    border: 1px solid var(--line);
  }
  .meter-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.25s ease;
  }
  .meter-fill.complete { background: var(--ok); }
  .meter-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
    min-width: 44px;
    text-align: right;
  }

  section.group {
    margin-bottom: 26px;
  }
  .group-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .group-head h2 {
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0.3px;
    margin: 0;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .group-head .sub-count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-faint);
  }

  ul.items {
    list-style: none;
    margin: 0;
    padding: 0;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }
  li.item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 14px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    user-select: none;
  }
  li.item:last-child { border-bottom: none; }
  li.item:hover { background: var(--panel-2); }

  .checkbox {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    border-radius: 50%;
    border: 2px solid var(--text-faint);
    position: relative;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  li.item.checked .checkbox {
    border-color: var(--accent);
    background: var(--accent);
  }
  .checkbox::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 7px; height: 7px;
    background: var(--bg);
    border-radius: 50%;
    transform: translate(-50%, -50%) scale(0);
    transition: transform 0.15s ease;
  }
  li.item.checked .checkbox::after {
    transform: translate(-50%, -50%) scale(1);
  }
  li.item.pulse .checkbox {
    animation: pulse 0.32s ease;
  }
  @keyframes pulse {
    0% { transform: scale(1); }
    45% { transform: scale(1.25); }
    100% { transform: scale(1); }
  }

  .item-text {
    font-size: 14px;
    color: var(--text);
    line-height: 1.4;
  }
  li.item.checked .item-text {
    color: var(--text-faint);
    text-decoration: line-through;
  }

  footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-top: 32px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
  }
  .reset-btn {
    background: none;
    border: 1px solid var(--line);
    color: var(--text-dim);
    border-radius: 8px;
    padding: 9px 14px;
    font-size: 13px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }
  .reset-btn:hover { border-color: var(--danger); color: var(--danger); }
  .last-shoot {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-faint);
  }

  .confirm-box {
    display: none;
    align-items: center;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--danger);
    border-radius: 8px;
    padding: 10px 14px;
    margin-top: 12px;
    font-size: 13px;
  }
  .confirm-box.show { display: flex; }
  .confirm-box button {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    border-radius: 6px;
    padding: 5px 10px;
    cursor: pointer;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--text);
  }
  .confirm-box button.yes {
    border-color: var(--danger);
    color: var(--danger);
  }

  /* Static Plates — shoot info + form */
  .sp-panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 14px 16px;
    margin-bottom: 18px;
  }
  .sp-panel-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .sp-panel-head h2 {
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: 0.3px;
    margin: 0;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .sp-panel-head .sp-hint {
    font-size: 11px;
    color: var(--text-faint);
    font-family: 'IBM Plex Mono', monospace;
  }
  .sp-subhead {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    color: var(--text-faint);
    margin: 16px 0 8px;
  }
  .sp-subhead:first-of-type { margin-top: 0; }
  .sp-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .sp-field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .sp-field.full { grid-column: 1 / -1; }
  .sp-field label {
    font-size: 11px;
    color: var(--text-faint);
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: 0.2px;
  }
  .sp-field input[type="text"],
  .sp-field input[type="number"],
  .sp-field input[type="date"],
  .sp-field select,
  .sp-field textarea {
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 6px;
    padding: 8px 9px;
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    width: 100%;
  }
  .sp-field textarea { resize: vertical; min-height: 44px; }
  .sp-field input:focus,
  .sp-field select:focus,
  .sp-field textarea:focus {
    outline: none;
    border-color: var(--accent);
  }
  .sp-combo { display: flex; gap: 6px; }
  .sp-combo select { flex: 1; min-width: 0; }
  .sp-combo input { flex: 1; min-width: 0; }
  .sp-unit-row { display: flex; gap: 6px; }
  .sp-unit-row input { flex: 2; min-width: 0; }
  .sp-unit-row select { flex: 1; min-width: 0; }
  .sp-plate-id {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--accent-text);
    background: var(--panel-2);
    border: 1px dashed var(--line);
    border-radius: 6px;
    padding: 8px 9px;
    word-break: break-all;
  }

  .sp-btn-row {
    display: flex;
    gap: 8px;
    margin-top: 18px;
    flex-wrap: wrap;
  }
  .sp-btn {
    flex: 1;
    min-width: 120px;
    border-radius: 8px;
    padding: 11px 10px;
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--text);
  }
  .sp-btn:hover { border-color: var(--text-faint); }
  .sp-btn.sp-btn-accent {
    border-color: var(--accent);
    color: var(--accent-text);
  }
  .sp-btn.sp-btn-accent:hover { background: var(--panel); }
  .sp-btn.sp-btn-ok {
    border-color: var(--ok);
    color: var(--ok-text);
  }

  .sp-log {
    font-size: 13px;
  }
  .sp-log-loc {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
    color: var(--text-dim);
  }
  .sp-log-loc:last-child { border-bottom: none; }
  .sp-log-loc .sp-loc-name { color: var(--text); }
  .sp-log-empty {
    color: var(--text-faint);
    font-size: 12px;
    font-style: italic;
  }

  .sp-toast {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--panel-2);
    border: 1px solid var(--accent);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 12px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 60;
    max-width: 90%;
    text-align: center;
  }
  .sp-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .sp-modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .sp-modal-overlay.show { display: flex; }
  .sp-modal-box {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    max-width: 560px;
    width: 100%;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .sp-modal-box h3 {
    margin: 0;
    font-family: 'Big Shoulders Display', sans-serif;
    text-transform: uppercase;
    font-size: 16px;
    color: var(--text);
  }
  .sp-modal-box p {
    margin: 0;
    font-size: 12px;
    color: var(--text-dim);
  }
  .sp-modal-box textarea {
    flex: 1;
    min-height: 220px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text-faint);
    border-radius: 6px;
    padding: 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
  }
  .sp-modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

  /* Single Camera - GS */
  .sp-check-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px 16px;
    margin-bottom: 4px;
  }
  .sp-check {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
  }
  .sp-check input {
    width: 16px;
    height: 16px;
    accent-color: var(--accent);
    flex: none;
  }
  .sc-counter-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 4px;
  }
  .sc-counter-row .sp-btn {
    flex: 0 0 48px;
    font-size: 20px;
    font-weight: 700;
    padding: 10px 0;
  }
  .sc-counter-display { flex: 1; text-align: center; }
  .sc-counter-num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 18px;
    color: var(--text);
  }
  .sc-counter-ts {
    font-size: 11px;
    color: var(--text-faint);
    margin-top: 2px;
  }
</style>
</head>
<body>

<header>
  <div class="title-block">
    <h1>Field Checklist</h1>
    <p>3DGS &amp; static plate capture — pre-flight through wrap</p>
  </div>
  <div class="header-right">
    <div class="total-count mono" id="total-count">0/0</div>
    <div class="total-label">items ready</div>
    <button class="theme-btn" id="theme-toggle">theme</button>
  </div>
</header>

<div class="dial" id="dial"></div>

<div class="meter-row">
  <div class="meter"><div class="meter-fill" id="tab-meter-fill"></div></div>
  <div class="meter-label mono" id="tab-meter-label">0%</div>
</div>

<div id="content"></div>

<footer>
  <span class="last-shoot mono" id="last-shoot"></span>
  <button class="reset-btn" id="reset-btn">Reset for next shoot</button>
</footer>

<div class="confirm-box" id="confirm-box">
  <span>Clear every checked item and all Static Plates / Single Camera - GS entries? This can't be undone.</span>
  <button id="confirm-cancel">Cancel</button>
  <button class="yes" id="confirm-yes">Clear all</button>
</div>

<div class="sp-toast" id="sp-toast"></div>

<div class="sp-modal-overlay" id="sp-modal-overlay">
  <div class="sp-modal-box">
    <h3 id="sp-modal-title">Report</h3>
    <p id="sp-modal-desc">Downloads aren't available in this view — copy the HTML below or open it in a new tab.</p>
    <textarea id="sp-modal-textarea" readonly></textarea>
    <div class="sp-modal-actions">
      <button class="sp-btn" id="sp-modal-open">Open in new tab</button>
      <button class="sp-btn" id="sp-modal-copy">Copy HTML</button>
      <button class="sp-btn sp-btn-accent" id="sp-modal-close">Close</button>
    </div>
  </div>
</div>

<script>
const DATA = [
  {
    id: 'single',
    label: 'Single Camera - GS',
    groups: [
      { title: 'Pre-flight — once per shoot', items: [
        'Check Camera Condition',
        'Lenses carried',
        'No of Batteries',
        'No of Cards and size',
        'Format all cards',
        'Colorchecker',
        'Tripod',
        'MonoPod',
        'Cleaning Kit',
      ]},
    ]
  },
  {
    id: 'multi',
    label: 'Multicam',
    groups: [
      { title: 'Pre-flight', items: [
        '7 cameras',
        '18mm lens x7',
        '64GB cards x9',
        '128GB card x1',
        '20 batteries',
        'Color checker',
        'Tripod',
        'Monopod',
        'Cleaning kit',
        'Multicam rig frame',
        '3 types of Allen keys',
        'Screws',
        'Other hardware',
        'Pack everything in bag',
      ]},
      { title: 'Scan day', items: [
        'Clean all cameras and lenses',
        'Format all cards',
        'Match ISO to master camera',
        'Match shutter speed to master camera',
        'Match aperture to master camera',
        'Match focal length to master camera',
        'Match AF focus to master camera',
        'RAW shooting enabled',
        'Connect all triggers',
        'Trigger all cameras — check focus and exposure across the rig',
        'Confirm timecode/sync holds through a full capture',
      ]},
    ]
  },
  {
    id: 'slam',
    label: 'SLAM',
    groups: [
      { title: 'Pre-flight', items: [
        'Scanner unit',
        'Battery',
        'Bag',
        'Monopod',
        'Color checker',
        'Processing laptop/tablet charged',
        'Scanner software/firmware updated',
      ]},
      { title: 'Scan day', items: [
        'Calibrate the scanner',
        'Test scanner working condition',
      ]},
    ]
  },
  {
    id: 'static',
    label: 'Static Plates',
    groups: [
      { title: 'Pre-flight (Gear) — once per shoot', items: [
        'Camera body + lenses charged and formatted',
        'Tripod',
        'Tape measure (height/distance measurements)',
        'Inclinometer / level app (tilt)',
        'Color checker',
        'Batteries',
        'Cards',
        'Cleaning kit',
        'Shoot Tracking Table / Plate ID list on hand',
        'Stand-in briefed on role for reference clip',
      ]},
    ]
  },
  {
    id: 'general',
    label: 'General',
    groups: [
      { title: 'Gear', items: [
        'Camera firmware updated',
        'Laptop + card reader for on-site backup',
        'Battery chargers + charging cables',
        'Extra cables (data transfer, power bank)',
        'Gray/white balance reference',
        'Card labels / naming convention set',
        'Reference scale bar or ruler',
        'Bubble level for rig leveling',
      ]},
      { title: 'Scene conditions', items: [
        'Lighting is flat/diffused — no harsh or shifting shadows',
        'No moving elements in frame (people, foliage, reflections)',
        'Shot coverage/overlap plan confirmed before starting',
        'Camera/rig positions marked with tape if returning to same spot',
        'White balance consistent across all cameras',
        'ND filters ready for bright/outdoor light',
      ]},
      { title: 'Logistics', items: [
        'Location access/permissions confirmed',
        'Power source confirmed on-site (outlets, generator, extension cables)',
        'Client/site contact person and access instructions noted',
        'Site permissions/release forms signed if needed',
        'Walkie-talkies or comms plan for larger crews',
      ]},
    ]
  },
  {
    id: 'wrap',
    label: 'Wrap-up',
    groups: [
      { title: 'On location', items: [
        'Check all cards for data integrity',
        'Run a quick test reconstruction/preview before full teardown',
        'Dismantle rig and pack into bags',
      ]},
      { title: 'Back at office', items: [
        'Backup all cards',
        'Rename/organize folders by shoot date and location',
        'Format all cards for next capture',
      ]},
    ]
  },
];

const STORAGE_KEY = 'field-checklist-state-v1';
const THEME_KEY = 'field-checklist-theme-v1';
const LAST_SHOOT_KEY = 'field-checklist-last-reset-v1';

let state = {};
try {
  const raw = localStorage.getItem(STORAGE_KEY);
  state = raw ? JSON.parse(raw) : {};
} catch (e) { state = {}; }

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

let activeTab = 'single';
try {
  const savedTab = localStorage.getItem('field-checklist-tab-v1');
  if (savedTab && DATA.find(d => d.id === savedTab)) activeTab = savedTab;
} catch (e) {}

function itemId(tabId, groupIdx, itemIdx) {
  return tabId + ':' + groupIdx + ':' + itemIdx;
}

function countAll() {
  let total = 0, done = 0;
  DATA.forEach(tab => {
    tab.groups.forEach((g, gi) => {
      g.items.forEach((_, ii) => {
        total++;
        if (state[itemId(tab.id, gi, ii)]) done++;
      });
    });
  });
  return { total, done };
}

function countTab(tab) {
  let total = 0, done = 0;
  tab.groups.forEach((g, gi) => {
    g.items.forEach((_, ii) => {
      total++;
      if (state[itemId(tab.id, gi, ii)]) done++;
    });
  });
  return { total, done };
}

function renderDial() {
  const dial = document.getElementById('dial');
  dial.innerHTML = '';
  DATA.forEach(tab => {
    const btn = document.createElement('button');
    btn.textContent = tab.label;
    if (tab.id === activeTab) btn.classList.add('active');
    btn.addEventListener('click', () => {
      activeTab = tab.id;
      try { localStorage.setItem('field-checklist-tab-v1', activeTab); } catch (e) {}
      renderAll();
    });
    dial.appendChild(btn);
  });
}

function spTimeOptions() {
  const opts = [];
  for (let h = 0; h < 24; h++) {
    for (const m of [0, 30]) {
      const period = h < 12 ? 'AM' : 'PM';
      let h12 = h % 12; if (h12 === 0) h12 = 12;
      opts.push(h12 + ':' + (m === 0 ? '00' : '30') + ' ' + period);
    }
  }
  return opts;
}
const SP_TIME_OPTIONS = spTimeOptions();

function spToday() {
  const d = new Date();
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return yyyy + '-' + mm + '-' + dd;
}

}

  locations: [],

  cardsUsed: [],
  cardsCopied: [],
};
try {
  const spRaw = localStorage.getItem(SP_STORAGE_KEY);
  if (spRaw) {
    const spParsed = JSON.parse(spRaw);
    if (spParsed.shootInfo) Object.assign(spState.shootInfo, spParsed.shootInfo);
    if (Array.isArray(spParsed.locations)) spState.locations = spParsed.locations;
    if (spParsed.draft) spState.draft = Object.assign(spBlankAngle(), spParsed.draft);
    if (Array.isArray(spParsed.cardsUsed)) spState.cardsUsed = spParsed.cardsUsed;
    else if (Array.isArray(spParsed.cards)) spState.cardsUsed = spParsed.cards;
    if (Array.isArray(spParsed.cardsCopied)) spState.cardsCopied = spParsed.cardsCopied;
  }
} catch (e) {}

function spSave() {
  try { localStorage.setItem(SP_STORAGE_KEY, JSON.stringify(spState)); } catch (e) {}
}

function spEsc(str) {
  return String(str == null ? '' : str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function spResolve(preset, custom) {
  return preset === 'custom' ? (custom || '').trim() : (preset || '').toString();
}

function spGcd(a, b) { a = Math.abs(a); b = Math.abs(b); return b === 0 ? a : spGcd(b, a % b); }

function spDerivedAspect(w, h) {
  const wn = parseFloat(w), hn = parseFloat(h);
  if (!wn || !hn) return '';
  const g = spGcd(Math.round(wn), Math.round(hn)) || 1;
  return Math.round(wn / g) + ':' + Math.round(hn / g);
}

function spPlateId(angle) {
  const loc = (angle.location || 'Location').trim().replace(/\s+/g, '');
  const name = (angle.angleName || 'Angle').trim().replace(/\s+/g, '');
  return loc + '_' + name;
}

function spFieldSummary(angle) {
  const focal = spResolve(angle.focalPreset, angle.focalCustom);
  const aperture = spResolve(angle.apertureStop, angle.apertureCustom);
  const iso = spResolve(angle.isoPreset, angle.isoCustom);
  const frameRate = spResolve(angle.frameRatePreset, angle.frameRateCustom);
  let aspect = spResolve(angle.aspectPreset, angle.aspectCustom);
  if (!aspect) aspect = spDerivedAspect(angle.resW, angle.resH);
  const colorTemp = spResolve(angle.colorTempPreset, angle.colorTempCustom);
  return { focal, aperture, iso, frameRate, aspect, colorTemp };
}

function spShootInfoSummary() {
  const si = spState.shootInfo;
  let sensorFormat = spResolve(si.sensorFormatPreset, si.sensorFormatCustom);
  if (si.sensorFormatPreset === 'custom' && si.sensorFormatCustom) {
    sensorFormat = 'Custom — ' + si.sensorFormatCustom;
  }
  return {
    projectName: si.projectName || '',
    cameraModel: si.cameraModel || '',
    sensorFormat,
    colorspace: spResolve(si.colorspacePreset, si.colorspaceCustom),
    gamma: spResolve(si.gammaPreset, si.gammaCustom),
  };
}

function spSanitizeName(str) {
  return (str || '').toString().trim().replace(/\s+/g, '').replace(/[\\/:*?"<>|]+/g, '') || 'Untitled';
}

function spFormatDateCompact(dateStr) {
  let d = dateStr ? new Date(dateStr + 'T00:00:00') : new Date();
  if (isNaN(d.getTime())) d = new Date();
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return '' + yyyy + mm + dd;
}

function spOptionsHTML(values, selected, opts) {
  opts = opts || {};
  const suffix = opts.suffix || '';
  let html = '<option value="">Select…</option>';
  values.forEach(v => {
    const val = String(v);
    const sel = String(selected) === val ? ' selected' : '';
    html += `<option value="${val}"${sel}>${val}${suffix}</option>`;
  });
  if (opts.custom !== false) {
    const sel = selected === 'custom' ? ' selected' : '';
    html += `<option value="custom"${sel}>Custom…</option>`;
  }
  return html;
}

function spUnitOptions(selected) {
  return SP_UNITS.map(u => `<option value="${u}"${selected === u ? ' selected' : ''}>${u}</option>`).join('');
}

function spRenderLog() {
  const log = document.getElementById('sp-log');
  if (!log) return;
  if (!spState.locations.length) {
    log.innerHTML = '<div class="sp-log-empty">Nothing saved yet — fill in the form above, then press + Angle or + Location.</div>';
    return;
  }
  log.innerHTML = spState.locations.map(loc =>
    `<div class="sp-log-loc"><span class="sp-loc-name">${spEsc(loc.name || '(unnamed)')}</span><span class="mono">${loc.angles.length} angle${loc.angles.length === 1 ? '' : 's'}</span></div>`
  ).join('');
}

function spFormatCardLine(entry) {
  const dt = new Date(entry.iso);
  const time = isNaN(dt.getTime()) ? '--:--:--' : dt.toLocaleTimeString('en-GB', { hour12: false });
  const date = isNaN(dt.getTime()) ? '--/--/----' : dt.toLocaleDateString('en-GB');
  return 'Card ' + String(entry.number).padStart(2, '0') + ' - ' + time + ' - ' + date;
}

function spRenderCardList(key, elId) {
  const log = document.getElementById(elId);
  if (!log) return;
  const list = spState[key] || [];
  if (!list.length) {
    log.innerHTML = '<div class="sp-log-empty">None logged yet.</div>';
    return;
  }
  log.innerHTML = list.map(entry =>
    `<div class="sp-log-loc"><span class="sp-loc-name">Card ${String(entry.number).padStart(2, '0')}</span><span class="mono">${new Date(entry.iso).toLocaleTimeString('en-GB', { hour12: false })} - ${new Date(entry.iso).toLocaleDateString('en-GB')}</span></div>`
  ).join('');
}

function spRenderCards() {
  spRenderCardList('cardsUsed', 'sp-card-used-log');
  spRenderCardList('cardsCopied', 'sp-card-copied-log');
}

function spLogCard(key, elId, label) {
  const list = spState[key] || (spState[key] = []);
  const number = list.length + 1;
  list.push({ number, iso: new Date().toISOString() });
  spSave();
  spRenderCardList(key, elId);
  spToast('Logged ' + label + ' ' + String(number).padStart(2, '0'));
}

function spBindField(id, evt, setter) {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener(evt, () => { setter(el.value); spSave(); });
}
function spBindToggle(id, wrapId, setter) {
  const el = document.getElementById(id);
  const wrapEl = document.getElementById(wrapId);
  if (!el) return;
  el.addEventListener('change', () => {
    setter(el.value);
    spSave();
    if (wrapEl) wrapEl.style.display = el.value === 'custom' ? '' : 'none';
  });
}
function spBindToggleMulti(id, wrapIds, setter) {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('change', () => {
    setter(el.value);
    spSave();
    wrapIds.forEach(wid => {
      const wrapEl = document.getElementById(wid);
      if (wrapEl) wrapEl.style.display = el.value === 'custom' ? '' : 'none';
    });
    if (el.id === 'sp-a-aspect') spUpdateDerivedAspect();
  });
}
function spUpdatePlateId() {
  const el = document.getElementById('sp-plate-id');
  if (el) el.textContent = spPlateId(spState.draft);
}
function spUpdateDerivedAspect() {

function spCommit(kind) {
  const d = spState.draft;
  if (!d.location.trim() && !d.angleName.trim()) {
    spToast('Add a location and angle name before saving.');
    return;
  }
  const savedAngle = Object.assign({}, d, { plateId: spPlateId(d) });

  let loc = spState.locations.find(l => l.name === d.location.trim());
  if (!loc) {
    loc = { name: d.location.trim(), angles: [] };
    spState.locations.push(loc);
  }
  loc.angles.push(savedAngle);
  spSave();

  const projectName = spState.shootInfo.projectName;
  if (kind === 'angle') {
    const fname = spFormatDateCompact(savedAngle.date) + '_' + spPlateId(savedAngle) + '_' + spSanitizeName(projectName);
    spGenerateReportFor([{ name: loc.name, angles: [savedAngle] }], 'Angle Report — ' + savedAngle.plateId, fname);
  } else {
    const fname = spFormatDateCompact(savedAngle.date) + '_' + spSanitizeName(projectName) + '_' + spSanitizeName(loc.name) + '_PlatesReport';
    spGenerateReportFor([{ name: loc.name, angles: loc.angles }], 'Location Report — ' + loc.name, fname);
  }

  const next = Object.assign({}, d);
  next.okTakes = ''; next.referenceClip = ''; next.notes = '';
  next.angleName = '';
  if (kind === 'location') next.location = '';
  spState.draft = next;
  spSave();
  spRefreshForm();
  spToast(kind === 'angle' ? 'Angle saved — report ready.' : 'Location saved — report ready.');
}

function spGenerateFullReport() {
  const clonedLocations = spState.locations.map(l => ({ name: l.name, angles: l.angles.slice() }));
  const d = spState.draft;
  if (d.location.trim() || d.angleName.trim()) {
    const draftAngle = Object.assign({}, d, { plateId: spPlateId(d) });
    let loc = clonedLocations.find(l => l.name === d.location.trim());
    if (!loc) {
      loc = { name: d.location.trim(), angles: [] };
      clonedLocations.push(loc);
    }
    loc.angles.push(draftAngle);
  }
  if (!clonedLocations.length) {
    spToast('Nothing captured yet.');
    return;
  }
  const projectName = spState.shootInfo.projectName;
  const fname = spFormatDateCompact(null) + '_' + spSanitizeName(projectName) + '_StaticPlatesReport';
  spGenerateReportFor(clonedLocations, 'Static Plates Report — ' + (projectName || 'Untitled Project'), fname);
}

/* ============ Generic PDF report drawing (jsPDF + AutoTable) ============ */
const PDF_MARGIN = 40;

function pdfNewDoc() {
  const { jsPDF } = window.jspdf;
  return new jsPDF({ unit: 'pt', format: 'a4', orientation: 'portrait' });
}
function pdfPageWidth(doc) { return doc.internal.pageSize.getWidth(); }
function pdfPageHeight(doc) { return doc.internal.pageSize.getHeight(); }
function pdfContentWidth(doc) { return pdfPageWidth(doc) - PDF_MARGIN * 2; }

function pdfEnsureSpace(doc, y, needed) {
  if (y + needed > pdfPageHeight(doc) - PDF_MARGIN) {
    doc.addPage();
    return PDF_MARGIN + 10;
  }
  return y;
}

function pdfDrawHeader(doc, title) {
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(18);
  doc.setTextColor(27, 28, 30);
  const lines = doc.splitTextToSize(title, pdfContentWidth(doc));
  doc.text(lines, PDF_MARGIN, 50);
  let y = 50 + (lines.length - 1) * 20;
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(9);
  doc.setTextColor(107, 110, 114);
  doc.text('Generated ' + new Date().toLocaleString(), PDF_MARGIN, y + 18);
  return y + 36;
}

function pdfDrawSectionHeading(doc, y, text) {
  y = pdfEnsureSpace(doc, y, 34);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(13);
  doc.setTextColor(27, 28, 30);
  doc.text(text, PDF_MARGIN, y);
  doc.setDrawColor(217, 96, 15);
  doc.setLineWidth(1.2);
  doc.line(PDF_MARGIN, y + 5, pdfPageWidth(doc) - PDF_MARGIN, y + 5);
  return y + 22;
}

function pdfDrawSubHeading(doc, y, text) {
  y = pdfEnsureSpace(doc, y, 46);
  doc.setFont('courier', 'bold');
  doc.setFontSize(11);
  doc.setTextColor(184, 90, 22);
  doc.text(text, PDF_MARGIN, y);
  return y + 14;
}

function pdfDrawKeyValueTable(doc, y, pairs) {
  const rows = [];
  for (let i = 0; i < pairs.length; i += 2) {
    const first = pairs[i];
    const second = pairs[i + 1];
    rows.push([
      first[0], first[1] || '—',
      second ? second[0] : '', second ? (second[1] || '—') : '',
    ]);
  }
  doc.autoTable({
    startY: y,
    margin: { left: PDF_MARGIN, right: PDF_MARGIN },
    body: rows,
    theme: 'plain',
    styles: { fontSize: 9, cellPadding: 3, textColor: [30, 30, 30], overflow: 'linebreak' },
    columnStyles: {
      0: { textColor: [91, 93, 88], cellWidth: 110 },
      1: { fontStyle: 'bold', cellWidth: 140 },
      2: { textColor: [91, 93, 88], cellWidth: 110 },
      3: { fontStyle: 'bold', cellWidth: 140 },
    },
  });
  return doc.lastAutoTable.finalY + 10;
}

function pdfDrawKeyValueBlock(doc, y, title, pairs) {
  y = pdfEnsureSpace(doc, y, 60);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(11);
  doc.setTextColor(91, 93, 88);
  doc.text(title.toUpperCase(), PDF_MARGIN, y);
  y += 14;
  y = pdfDrawKeyValueTable(doc, y, pairs);
  return y + 6;
}

function pdfDrawNotes(doc, y, notes) {
  if (!notes) return y + 4;
  y = pdfEnsureSpace(doc, y, 30);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(9);
  doc.setTextColor(30, 30, 30);
  doc.text('Notes:', PDF_MARGIN, y);
  doc.setFont('helvetica', 'normal');
  const lines = doc.splitTextToSize(notes, pdfContentWidth(doc) - 45);
  doc.text(lines, PDF_MARGIN + 42, y);
  return y + lines.length * 11 + 12;
}

function pdfDrawChecklistTable(doc, y, items) {
  if (!items.length) {
    doc.setFont('helvetica', 'italic');
    doc.setFontSize(9);
    doc.setTextColor(138, 140, 134);
    doc.text('No checklist items configured.', PDF_MARGIN, y);
    return y + 18;
  }
  const body = items.map(it => [it.checked ? 'X' : '', it.label]);
  doc.autoTable({
    startY: y,
    margin: { left: PDF_MARGIN, right: PDF_MARGIN },
    body,
    theme: 'plain',
    styles: { fontSize: 9, cellPadding: 4 },
    columnStyles: {
      0: { cellWidth: 22, halign: 'center', fontStyle: 'bold', textColor: [46, 125, 50] },
      1: { textColor: [30, 30, 30] },
    },
  });
  return doc.lastAutoTable.finalY + 10;
}

function pdfDrawCardTable(doc, y, title, list) {
  y = pdfDrawSectionHeading(doc, y, title);
  if (!list || !list.length) {
    doc.setFont('helvetica', 'italic');
    doc.setFontSize(9);
    doc.setTextColor(138, 140, 134);
    doc.text('None logged.', PDF_MARGIN, y);
    return y + 18;
  }
  const body = list.map(entry => {
    const dt = new Date(entry.iso);
    const time = isNaN(dt.getTime()) ? '—' : dt.toLocaleTimeString('en-GB', { hour12: false });
    const date = isNaN(dt.getTime()) ? '—' : dt.toLocaleDateString('en-GB');
    return ['Card ' + String(entry.number).padStart(2, '0'), time, date];
  });
  doc.autoTable({
    startY: y,
    margin: { left: PDF_MARGIN, right: PDF_MARGIN },
    head: [['Card', 'Time', 'Date']],
    body,
    theme: 'striped',
    styles: { fontSize: 9, cellPadding: 4 },
    headStyles: { fillColor: [245, 245, 241], textColor: [60, 60, 60] },
  });
  return doc.lastAutoTable.finalY + 10;
}

function getTabChecklistItems(tabId) {
  const tab = DATA.find(t => t.id === tabId);
  if (!tab) return [];
  const items = [];
  tab.groups.forEach((g, gi) => {
    g.items.forEach((label, ii) => {
      items.push({ label, checked: !!state[itemId(tabId, gi, ii)] });
    });
  });
  return items;
}

    <h2>Static Plates</h2>
    ${locations.length ? spLocationsHTML(locations) : '<div class="empty-note">No locations captured.</div>'}
  </div>
  ${spCardTableHTML('Cards Used', spState.cardsUsed)}
  ${spCardTableHTML('Cards Copied', spState.cardsCopied)}
</body>
</html>`;
}

function spBuildShootReportPDF(title, locations) {
  const doc = pdfNewDoc();
  let y = pdfDrawHeader(doc, title);
  y = pdfDrawKeyValueBlock(doc, y, 'Shoot Info', spShootInfoPairs());
  y = pdfDrawSectionHeading(doc, y, 'Pre-flight Checklist');
  y = pdfDrawChecklistTable(doc, y, getTabChecklistItems('static'));
  y = pdfEnsureSpace(doc, y, 34);
  y = pdfDrawSectionHeading(doc, y, 'Static Plates');
  if (!locations.length) {
    doc.setFont('helvetica', 'italic');
    doc.setFontSize(9);
    doc.setTextColor(138, 140, 134);
    doc.text('No locations captured.', PDF_MARGIN, y);
    y += 18;
  } else {
    y = spDrawLocationsPDF(doc, y, locations);
  }
  y = pdfEnsureSpace(doc, y, 40);
  y = pdfDrawCardTable(doc, y, 'Cards Used', spState.cardsUsed);
  y = pdfEnsureSpace(doc, y, 40);
  y = pdfDrawCardTable(doc, y, 'Cards Copied', spState.cardsCopied);
  return doc;
}

function spGenerateShootReport() {
  const clonedLocations = spState.locations.map(l => ({ name: l.name, angles: l.angles.slice() }));
  const d = spState.draft;
  if (d.location.trim() || d.angleName.trim()) {
    const draftAngle = Object.assign({}, d, { plateId: spPlateId(d) });
    let loc = clonedLocations.find(l => l.name === d.location.trim());
    if (!loc) {
      loc = { name: d.location.trim(), angles: [] };
      clonedLocations.push(loc);
    }
    loc.angles.push(draftAngle);
  }
  const projectName = spState.shootInfo.projectName;
  const fname = spFormatDateCompact(null) + '_' + spSanitizeName(projectName) + '_ShootReport';
  const title = 'Shoot Report — ' + (projectName || 'Untitled Project');
  try {
    const doc = spBuildShootReportPDF(title, clonedLocations);
    offerDownload(fname + '.pdf', doc.output('blob'));
  } catch (e) {
    spToast('PDF generation failed — sending HTML instead.');
    offerDownload(fname + '.html', spBuildShootReportHTML(title, clonedLocations));
  }
}

function spToast(msg) {
  const el = document.getElementById('sp-toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._spTimer);
  el._spTimer = setTimeout(() => el.classList.remove('show'), 3200);
}

async function offerDownload(filename, data) {
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      const downloads = await window.claude.use('downloads');
      if (downloads) {
        try {
          await downloads.save({ filename, data });
          spToast('Saved ' + filename);
          return;
        } catch (e) {
          if (e && e.code === 'declined') return;
        }
      }
    }
  } catch (e) {}
  spShowReportModal(filename, data);
}

function spShowReportModal(filename, data) {
  const overlay = document.getElementById('sp-modal-overlay');
  if (!overlay) return;
  const isBlob = (typeof Blob !== 'undefined') && data instanceof Blob;
  const ta = document.getElementById('sp-modal-textarea');
  const copyBtn = document.getElementById('sp-modal-copy');
  const openBtn = document.getElementById('sp-modal-open');

  document.getElementById('sp-modal-title').textContent = filename;
  overlay.classList.add('show');

  if (isBlob) {
    document.getElementById('sp-modal-desc').textContent = "Downloads aren't available in this view — open the PDF in a new tab and save it from there (e.g. the browser's print/share menu).";
    ta.style.display = 'none';
    copyBtn.style.display = 'none';
    openBtn.style.display = '';
    openBtn.onclick = () => {
      try {
        const url = URL.createObjectURL(data);
        window.open(url, '_blank');
      } catch (e) {}
    };
  } else {
    document.getElementById('sp-modal-desc').textContent = "Downloads aren't available in this view — copy the HTML below or open it in a new tab.";
    ta.style.display = '';
    copyBtn.style.display = '';
    ta.value = data;
    openBtn.style.display = '';
    openBtn.onclick = () => {
      try {
        const blob = new Blob([data], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        window.open(url, '_blank');
      } catch (e) {}
    };
    copyBtn.onclick = () => {
      ta.select();
      try {
        document.execCommand('copy');
        spToast('Copied to clipboard');
      } catch (e) {
        if (navigator.clipboard) navigator.clipboard.writeText(data).then(() => spToast('Copied to clipboard'));
      }
    };
  }
}

function scBlankVariant() {
  return {
    location: '', variantName: '',
    sensorModeChecked: false,
    captureQualityRawChecked: false,
    shutterSpeedChecked: false,
    isoChecked: false,
    apertureChecked: false,
    cleanChecked: false,
    cameraPreset: '', cameraCustom: '',
    lens1Preset: '', lens1Custom: '',
    lens2Preset: '', lens2Custom: '',
    cards: [],
  };
}

let scState = {
  projectName: '',
  locations: [],
  draft: scBlankVariant(),
  cardCounter: 1,
  cardCounterTimestamp: null,
};
try {
  const scRaw = localStorage.getItem(SC_STORAGE_KEY);
  if (scRaw) {
    const scParsed = JSON.parse(scRaw);
    if (typeof scParsed.projectName === 'string') scState.projectName = scParsed.projectName;
    if (Array.isArray(scParsed.locations)) scState.locations = scParsed.locations;
    if (scParsed.draft) scState.draft = Object.assign(scBlankVariant(), scParsed.draft);
    if (typeof scParsed.cardCounter === 'number') scState.cardCounter = scParsed.cardCounter;
    if (scParsed.cardCounterTimestamp) scState.cardCounterTimestamp = scParsed.cardCounterTimestamp;
  }
} catch (e) {}

function scSave() {
  try { localStorage.setItem(SC_STORAGE_KEY, JSON.stringify(scState)); } catch (e) {}
}

function scVariantId(v) {
  const loc = (v.location || 'Location').trim().replace(/\s+/g, '');
  const name = (v.variantName || 'Variant').trim().replace(/\s+/g, '');

}

function scRenderLog() {

  ).join('');
}

function scRenderCardLog() {
  const log = document.getElementById('sc-card-log');
  if (!log) return;
  const cards = scState.draft.cards || [];
  if (!cards.length) {
    log.innerHTML = '<div class="sp-log-empty">No cards logged for this variant yet.</div>';
    return;
  }
  log.innerHTML = cards.map(c => `<div class="sp-log-loc"><span class="sp-loc-name">${spEsc(spFormatCardLine(c))}</span></div>`).join('');

function scBindField(id, evt, setter) {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener(evt, () => { setter(el.value); scSave(); });
}
function scBindCheckbox(id, setter) {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('change', () => { setter(el.checked); scSave(); });
}
function scBindToggle(id, wrapId, setter) {
  const el = document.getElementById(id);
  const wrapEl = document.getElementById(wrapId);
  if (!el) return;
  el.addEventListener('change', () => {
    setter(el.value);
    scSave();
    if (wrapEl) wrapEl.style.display = el.value === 'custom' ? '' : 'none';
  });
}
function scUpdateVariantId() {
  const el = document.getElementById('sc-variant-id');
  if (el) el.textContent = scVariantId(scState.draft);
}

function scUpdateNextCardLabel() {
  const el = document.getElementById('sc-next-card-label');
  if (el) el.textContent = 'Next: Card ' + String(scState.cardCounter).padStart(2, '0');
}

function scAddCard() {
  const d = scState.draft;
  if (!d.cards) d.cards = [];
  const entry = { number: scState.cardCounter, iso: new Date().toISOString() };
  d.cards.push(entry);
  scState.cardCounter = scState.cardCounter + 1;
  scSave();
  scRenderCardLog();
  scUpdateNextCardLabel();
  spToast('Logged ' + spFormatCardLine(entry));
}

function scRemoveLastCard() {
  const d = scState.draft;
  if (!d.cards || !d.cards.length) return;
  const removed = d.cards.pop();
  if (removed && scState.cardCounter > removed.number) {
    scState.cardCounter = removed.number;
  }
  scSave();
  scRenderCardLog();
  scUpdateNextCardLabel();
}

  scBindField('sc-location', 'input', v => { d.location = v; scUpdateVariantId(); });

function scCommit(kind) {
  const d = scState.draft;
  if (!d.location.trim() && !d.variantName.trim()) {
    spToast('Add a location and variant name before saving.');
    return;
  }
  const savedVariant = Object.assign({}, d, {
    variantId: scVariantId(d),
    cards: (d.cards || []).slice(),
  });

  let loc = scState.locations.find(l => l.name === d.location.trim());
  if (!loc) {
    loc = { name: d.location.trim(), variants: [] };
    scState.locations.push(loc);
  }
  loc.variants.push(savedVariant);
  scSave();

  const fnameProject = spSanitizeName(scState.projectName);
  if (kind === 'variant') {
    const fname = spFormatDateCompact(null) + '_' + savedVariant.variantId + '_' + fnameProject;
    scGenerateReportFor([{ name: loc.name, variants: [savedVariant] }], 'Variant Report — ' + savedVariant.variantId, fname);
  } else {
    const fname = spFormatDateCompact(null) + '_' + fnameProject + '_' + spSanitizeName(loc.name) + '_CaptureReport';
    scGenerateReportFor([{ name: loc.name, variants: loc.variants }], 'Location Report — ' + loc.name, fname);
  }

  const next = Object.assign({}, d);
  next.variantName = '';
  next.sensorModeChecked = false;
  next.captureQualityRawChecked = false;
  next.shutterSpeedChecked = false;
  next.isoChecked = false;
  next.apertureChecked = false;
  next.cleanChecked = false;
  next.cards = [];
  if (kind === 'location') next.location = '';
  scState.draft = next;
  scSave();
  scRefreshForm();
  spToast(kind === 'variant' ? 'Variant saved — report ready.' : 'Location saved — report ready.');
}

function scVariantFieldPairs(variant) {
  const camera = spResolve(variant.cameraPreset, variant.cameraCustom);
  const lens1 = spResolve(variant.lens1Preset, variant.lens1Custom);
  const lens2 = spResolve(variant.lens2Preset, variant.lens2Custom);
  return [
    ['Camera', camera],
    ['Lens 1', lens1 ? lens1 + 'mm' : ''],
    ['Lens 2', lens2 ? lens2 + 'mm' : ''],
    ['Sensor Mode Checked', variant.sensorModeChecked ? 'Yes' : 'No'],
    ['Capture Quality RAW', variant.captureQualityRawChecked ? 'Yes' : 'No'],
    ['Shutter Speed Checked', variant.shutterSpeedChecked ? 'Yes' : 'No'],
    ['ISO Checked', variant.isoChecked ? 'Yes' : 'No'],
    ['Aperture Checked', variant.apertureChecked ? 'Yes' : 'No'],
    ['Camera & Lens Cleaned', variant.cleanChecked ? 'Yes' : 'No'],
  ];
}

function pdfDrawCardList(doc, y, cards) {
  if (!cards || !cards.length) return y;
  y = pdfEnsureSpace(doc, y, 20 + cards.length * 12);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(9);
  doc.setTextColor(30, 30, 30);
  doc.text('Cards Used:', PDF_MARGIN, y);
  y += 12;
  doc.setFont('helvetica', 'normal');
  doc.setTextColor(60, 60, 60);
  cards.forEach(c => {
    y = pdfEnsureSpace(doc, y, 14);
    doc.text('• ' + spFormatCardLine(c), PDF_MARGIN + 10, y);
    y += 12;
  });
  return y + 6;
}

function scDrawLocationsPDF(doc, y, locations) {
  locations.forEach(loc => {
    y = pdfDrawSectionHeading(doc, y, loc.name || '(unnamed location)');
    loc.variants.forEach(variant => {
      y = pdfDrawSubHeading(doc, y, variant.variantId || scVariantId(variant));
      y = pdfDrawKeyValueTable(doc, y, scVariantFieldPairs(variant));
      y = pdfDrawCardList(doc, y, variant.cards);
      y += 4;
    });
  });
  return y;
}

function scBuildReportPDF(title, locations) {
  const doc = pdfNewDoc();
  let y = pdfDrawHeader(doc, title);
  y = pdfDrawKeyValueBlock(doc, y, 'Project', [['Project Name', scState.projectName]]);
  y = scDrawLocationsPDF(doc, y, locations);
  return doc;
}

function scGenerateReportFor(locations, title, filenameBase) {
  try {
    const doc = scBuildReportPDF(title, locations);
    offerDownload(filenameBase + '.pdf', doc.output('blob'));
  } catch (e) {
    spToast('PDF generation failed.');
  }
}

function scGenerateFullReport() {
  const clonedLocations = scState.locations.map(l => ({ name: l.name, variants: l.variants.slice() }));
  const d = scState.draft;
  if (d.location.trim() || d.variantName.trim()) {
    const draftVariant = Object.assign({}, d, {
      variantId: scVariantId(d),
      cards: (d.cards || []).slice(),
    });
    let loc = clonedLocations.find(l => l.name === d.location.trim());
    if (!loc) {
      loc = { name: d.location.trim(), variants: [] };
      clonedLocations.push(loc);
    }
    loc.variants.push(draftVariant);
  }
  if (!clonedLocations.length) {
    spToast('Nothing captured yet.');
    return;
  }
  const fname = spFormatDateCompact(null) + '_' + spSanitizeName(scState.projectName) + '_SingleCamReport';
  scGenerateReportFor(clonedLocations, 'Single Camera GS Report — ' + (scState.projectName || 'Untitled Project'), fname);
}

function renderContent() {
  const content = document.getElementById('content');
  content.innerHTML = '';
  const tab = DATA.find(d => d.id === activeTab);

  tab.groups.forEach((group, gi) => {
    const section = document.createElement('section');
    section.className = 'group';

    const head = document.createElement('div');
    head.className = 'group-head';
    const h2 = document.createElement('h2');
    h2.textContent = group.title;
    const doneCount = group.items.filter((_, ii) => state[itemId(tab.id, gi, ii)]).length;
    const subCount = document.createElement('span');
    subCount.className = 'sub-count mono';
    subCount.textContent = doneCount + '/' + group.items.length;
    head.appendChild(h2);
    head.appendChild(subCount);
    section.appendChild(head);

    const ul = document.createElement('ul');
    ul.className = 'items';
    group.items.forEach((text, ii) => {
      const id = itemId(tab.id, gi, ii);
      const li = document.createElement('li');
      li.className = 'item' + (state[id] ? ' checked' : '');
      const box = document.createElement('div');
      box.className = 'checkbox';
      const span = document.createElement('span');
      span.className = 'item-text';
      span.textContent = text;
      li.appendChild(box);
      li.appendChild(span);
      li.addEventListener('click', () => {
        state[id] = !state[id];
        saveState();
        li.classList.toggle('checked', !!state[id]);
        li.classList.remove('pulse');
        void li.offsetWidth;
        li.classList.add('pulse');
        updateMeters();
      });
      ul.appendChild(li);
    });
    section.appendChild(ul);
    content.appendChild(section);
  });

  if (tab.id === 'static') {
    renderStaticSection(content);
  }
  if (tab.id === 'single') {
    renderSingleCamSection(content);
  }
}

function updateMeters() {
  const totalStats = countAll();
  document.getElementById('total-count').textContent = totalStats.done + '/' + totalStats.total;

  const tab = DATA.find(d => d.id === activeTab);
  const tabStats = countTab(tab);
  const pct = tabStats.total ? Math.round((tabStats.done / tabStats.total) * 100) : 0;
  const fill = document.getElementById('tab-meter-fill');
  fill.style.width = pct + '%';
  fill.classList.toggle('complete', pct === 100);
  document.getElementById('tab-meter-label').textContent = pct + '%';

  document.querySelectorAll('.group').forEach((section, gi) => {
    const group = tab.groups[gi];
    const doneCount = group.items.filter((_, ii) => state[itemId(tab.id, gi, ii)]).length;
    const subCount = section.querySelector('.sub-count');
    if (subCount) subCount.textContent = doneCount + '/' + group.items.length;
  });
}

function renderAll() {
  renderDial();
  renderContent();
  updateMeters();
}

function loadLastShoot() {
  try {
    const val = localStorage.getItem(LAST_SHOOT_KEY);
    document.getElementById('last-shoot').textContent = val ? ('last reset ' + val) : '';
  } catch (e) {}
}

document.getElementById('reset-btn').addEventListener('click', () => {
  document.getElementById('confirm-box').classList.add('show');
});
document.getElementById('confirm-cancel').addEventListener('click', () => {
  document.getElementById('confirm-box').classList.remove('show');
});
document.getElementById('confirm-yes').addEventListener('click', () => {
  state = {};
  saveState();
  spState = {
    shootInfo: spBlankShootInfo(),
    locations: [],
    draft: spBlankAngle(),
    cardsUsed: [],
    cardsCopied: [],
  };
  spSave();
  scState = {
    projectName: '',
    locations: [],
    draft: scBlankVariant(),
    cardCounter: 1,
    cardCounterTimestamp: null,
  };
  scSave();
  const dateStr = new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
  try { localStorage.setItem(LAST_SHOOT_KEY, dateStr); } catch (e) {}
  loadLastShoot();
  document.getElementById('confirm-box').classList.remove('show');
  renderAll();
});

document.getElementById('sp-modal-close').addEventListener('click', () => {
  document.getElementById('sp-modal-overlay').classList.remove('show');
});

document.getElementById('theme-toggle').addEventListener('click', () => {
  const root = document.documentElement;
  const current = root.getAttribute('data-theme');
  let next;
  if (current === 'light') next = 'dark';
  else if (current === 'dark') next = null;
  else next = 'light';
  if (next) root.setAttribute('data-theme', next);
  else root.removeAttribute('data-theme');
  try {
    if (next) localStorage.setItem(THEME_KEY, next);
    else localStorage.removeItem(THEME_KEY);
  } catch (e) {}
});

try {
  const savedTheme = localStorage.getItem(THEME_KEY);
  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
} catch (e) {}

loadLastShoot();
renderAll();
</script>

</body>
</html>
